[package]
name = "ctrim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["mkamranr"]
license = "MIT OR Apache-2.0"
description = "Strip noise from terminal output before it reaches an LLM. Folds stack traces, collapses repeated log lines, and minimizes diffs to cut token usage by 60-80%."
repository = "https://github.com/mkamranr/ctrim"
homepage = "https://github.com/mkamranr/ctrim"
documentation = "https://docs.rs/ctrim"
readme = "README.md"
keywords = ["llm", "tokens", "cli", "logs", "context"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
exclude = ["/.github", "/tests/fixtures/generated", "/prd_specification.md"]

[lib]
name = "ctrim"
path = "src/lib.rs"

[[bin]]
name = "ctrim"
path = "src/main.rs"

[features]
default = []
# Exact BPE token counting via tiktoken-rs. Adds ~4MB to the binary and a
# noticeable cold-start cost; the heuristic estimator is used without it.
exact-tokens = ["dep:tiktoken-rs"]

[dependencies]
anyhow = "1.0"
# `image-data` (a default) pulls in an image codec stack we never use; the
# Wayland backend is opt-in and needed for clipboard support outside X11.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.6", features = ["derive"] }
once_cell = "1.21"
regex = "1.13"
tiktoken-rs = { version = "0.12", optional = true }

[dev-dependencies]
assert_cmd = "2.2"
criterion = "0.8"
insta = "1.48"
predicates = "3.1"

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
