name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  musl: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, musl: true, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tooling
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo install cross --locked
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.tag }}" ] && VERSION="${{ inputs.tag }}" && VERSION="${VERSION#v}"
          NAME="ctrim-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/ctrim.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/ctrim" "dist/$NAME/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          cd dist
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: cat artifacts/*.sha256 > artifacts/SHA256SUMS

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true

      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo publish --locked

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The tap lives in another repository, so it needs a token of its own.
      - name: Update the tap formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "TAP_TOKEN is not set; skipping the Homebrew tap update." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          sha() { grep -h "$1" artifacts/*.sha256 | cut -d' ' -f1; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mkamranr/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/ctrim.rb <<EOF
          class Ctrim < Formula
            desc "Strip noise from terminal output before it reaches an LLM"
            homepage "https://github.com/mkamranr/ctrim"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "https://github.com/mkamranr/ctrim/releases/download/v${VERSION}/ctrim-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "https://github.com/mkamranr/ctrim/releases/download/v${VERSION}/ctrim-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              url "https://github.com/mkamranr/ctrim/releases/download/v${VERSION}/ctrim-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
              sha256 "$(sha x86_64-unknown-linux-musl)"
            end

            def install
              bin.install "ctrim"
            end

            test do
              assert_match "ctrim", shell_output("echo hi | #{bin}/ctrim --quiet --format raw")
            end
          end
          EOF
          cd tap
          git config user.name "ctrim release bot"
          git config user.email "noreply@github.com"
          # `git add`, not `commit -a`: the formula is a new file on first release.
          git add Formula/ctrim.rb
          git commit -m "ctrim ${VERSION}"
          git push

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ctrim:latest
            ghcr.io/${{ github.repository_owner }}/ctrim:${{ github.ref_name }}
