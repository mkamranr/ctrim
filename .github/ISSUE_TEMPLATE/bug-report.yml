name: Bug report
description: Something crashed, hung, or produced invalid output
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The exact command, and the input if you can share it.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ctrim version and platform
      placeholder: 0.1.0, macOS 14 arm64
    validations:
      required: true
